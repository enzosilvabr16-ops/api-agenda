services:

  mysql:
    image: mysql:8.0
    container_name: mysql-agenda
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: bd-agenda
      MYSQL_USER: coti
      MYSQL_PASSWORD: Coti2026
      MYSQL_ROOT_PASSWORD: Coti2026
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agenda_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-agenda
    restart: always
    ports:
      - "5050:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: Coti2026
    networks:
      - agenda_network
    depends_on:
      - mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-agenda
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: coti
      RABBITMQ_DEFAULT_PASS: coti
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agenda_network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  agenda_network:
    driver: bridge